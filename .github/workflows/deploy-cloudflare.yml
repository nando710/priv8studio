name: Publicar na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the repository variables from DEPLOY.md exist.
    if: vars.CF_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test.mjs
      - run: npx tsc --noEmit
      - run: node scripts/deploy-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
